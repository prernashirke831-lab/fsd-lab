<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assignment 3 – Form Validation</title>
<link rel="stylesheet" href="../assets/shared.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar"><a href="../index.html">All assignments</a><span>Assignment 3 of 6</span></header>
<main class="container narrow">
  <h1>Create your account</h1>
  <p class="sub">Registration form validated with JavaScript. Fields are checked when you leave them and again on submit.</p>

  <form id="reg-form" class="card" novalidate>
    <div class="field">
      <label for="name">Full name</label>
      <input id="name" name="name" type="text" autocomplete="name" placeholder="e.g. Prerna Shirke">
      <p class="error" id="name-error"></p>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com">
      <p class="error" id="email-error"></p>
    </div>
    <div class="field">
      <label for="phone">Mobile number</label>
      <input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="numeric" maxlength="14" placeholder="10-digit number, e.g. 9876543210">
      <p class="error" id="phone-error"></p>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <div class="pw-row">
        <input id="password" name="password" type="password" autocomplete="new-password" placeholder="At least 8 characters">
        <button type="button" class="ghost" id="toggle-pw" aria-pressed="false">Show</button>
      </div>
      <div class="meter" aria-hidden="true"><span id="meter-bar"></span></div>
      <p class="hint" id="meter-text">Use upper and lower case letters, a number and a symbol.</p>
      <p class="error" id="password-error"></p>
    </div>
    <div class="field">
      <label for="confirm">Confirm password</label>
      <input id="confirm" name="confirm" type="password" autocomplete="new-password" placeholder="Type the password again">
      <p class="error" id="confirm-error"></p>
    </div>
    <button type="submit">Create account</button>
  </form>

  <div id="success" class="card success" hidden role="status">
    <h2>Account created</h2>
    <p id="success-text"></p>
    <button class="ghost" id="reset">Register another user</button>
  </div>
</main>
<script src="script.js"></script>
</body>
</html>
