<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assignment 1 – JavaScript Calculator</title>
<link rel="stylesheet" href="../assets/shared.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar"><a href="../index.html">All assignments</a><span>Assignment 1 of 6</span></header>
<main class="container narrow">
  <h1>JavaScript Calculator</h1>
  <p class="sub">Basic arithmetic built from separate functions (add, subtract, multiply, divide) and a switch statement. Keyboard works too: digits, + - * /, Enter, Backspace and Escape.</p>
  <section class="card calc" aria-label="Calculator">
    <div class="display" aria-live="polite">
      <div id="history" class="history"></div>
      <div id="screen" class="screen">0</div>
    </div>
    <div class="keys" id="keys">
      <button class="ghost" data-action="clear">C</button>
      <button class="ghost" data-action="back" aria-label="Backspace">&#9003;</button>
      <button class="op" data-op="/" aria-label="Divide">&divide;</button>
      <button class="op" data-op="*" aria-label="Multiply">&times;</button>
      <button class="num" data-num="7">7</button>
      <button class="num" data-num="8">8</button>
      <button class="num" data-num="9">9</button>
      <button class="op" data-op="-" aria-label="Subtract">&minus;</button>
      <button class="num" data-num="4">4</button>
      <button class="num" data-num="5">5</button>
      <button class="num" data-num="6">6</button>
      <button class="op" data-op="+" aria-label="Add">+</button>
      <button class="num" data-num="1">1</button>
      <button class="num" data-num="2">2</button>
      <button class="num" data-num="3">3</button>
      <button class="equals" data-action="equals" aria-label="Equals">=</button>
      <button class="num zero" data-num="0">0</button>
      <button class="num" data-action="dot" aria-label="Decimal point">.</button>
    </div>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
